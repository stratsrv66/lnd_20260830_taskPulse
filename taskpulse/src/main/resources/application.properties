spring.application.name=taskpulse

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/taskpulse}
spring.data.mongodb.auto-index-creation=true

taskpulse.auth.issuer=taskpulse
taskpulse.auth.jwt-secret=${TASKPULSE_JWT_SECRET}
taskpulse.auth.access-token-ttl=15m
taskpulse.auth.refresh-token-ttl=30d
taskpulse.auth.refresh-cookie-name=taskpulse_refresh
taskpulse.auth.refresh-cookie-path=/api/auth
taskpulse.auth.refresh-cookie-secure=${TASKPULSE_COOKIE_SECURE:false}
taskpulse.auth.refresh-cookie-same-site=Strict
taskpulse.auth.allowed-origins=${TASKPULSE_ALLOWED_ORIGINS:http://localhost:5173}
